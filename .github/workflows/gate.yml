# The seed's own gate, run unasked.
#
# CYPRESS's thesis is that gates run before anything is called done. Until
# 7.16.0 the seed exempted itself: the full gate (ask tools/gate-registry.py --summary for the count)
# existed, and every one of them ran only when a person remembered to type
# `bash tests/run.sh`. A discipline the project will not apply to itself is a
# preference.
#
# Two platforms, deliberately. The installer's placement contract is mostly
# about symlinks — link-object replacement, copy-vs-link uniformity, a
# destination symlinked outside the target — and symlink semantics are where
# Linux and macOS differ. A green gate on one host says nothing about the
# other, and the seed claims to install on both.
name: gate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    strategy:
      fail-fast: false          # report BOTH platforms; a macOS-only failure
                                # is the finding this matrix exists to surface
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history (not the default shallow clone): gate tests read
          # git history and tags, e.g. `git show v7.36.0:...`.
          fetch-depth: 0

      # The seed's Python floor (its one home is SPEC-0005 §5 "Compatibility";
      # install.sh's PYTHON_FLOOR is the copy tests/test-tool-help.sh holds to
      # it). The gate runs on the floor itself, so a construct newer than the
      # floor fails here, and tests/test-tool-help.sh starts every shipped
      # script on it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # No `pip install` step, and that is the contract rather than an
      # omission: every shipped script and every default-gate test is
      # dependency-free stdlib Python, so a gate that needed a package would
      # mean something in the tree had broken that rule. If this job ever
      # fails for a missing import, fix the import, not this file.
      - name: Record the environment the numbers were measured in
        run: |
          python3 --version
          bash --version | head -1
          uname -srm

      - name: Strict gate
        run: bash tests/run.sh

  # The OpenCode plugin's fixture half (F1-F7) loads the plugin under bun, which
  # the gate job above lacks, so there that half prints SKIPPED-PART and the
  # summary names it. The owner decided on 2026-11-11 that at least one CI job
  # runs those cases: this job installs one pinned bun release, checks the
  # archive against the checksum recorded here, and sets CYPRESS_REQUIRE_BUN=1,
  # so a bun that fails to land fails the job instead of skipping the half.
  # Moving to a new bun release means changing BUN_VERSION and BUN_SHA256
  # together, the checksum taken from that release's SHASUMS256.txt.
  opencode-plugin:
    runs-on: ubuntu-latest
    env:
      BUN_VERSION: "1.3.14"
      BUN_SHA256: "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install bun at the pinned version, checked against its recorded checksum
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/bun"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $dir/bun.zip" | sha256sum -c -
          unzip -q "$dir/bun.zip" -d "$dir"
          echo "$dir/bun-linux-x64" >> "$GITHUB_PATH"

      - name: OpenCode plugin cases, fixture half required
        env:
          CYPRESS_REQUIRE_BUN: "1"
        run: |
          bun --version
          bash tests/test-opencode-plugin.sh
