# Publishes a GitHub Release when a vX.Y.Z tag is pushed.
#
# This does not write prose. tools/prepare-release.py stages
# .github/RELEASE_NOTES.md ahead of time, at commit time, from the
# CHANGELOG.md entry that already passed canonize's humanizer pass — one
# prose home, reused, never re-derived from a diff here. CI has no access to
# the judgment skills/humanizer and skill-corpus/discardme.md both require,
# so this job only checks the staged file exists and hands it to `gh
# release create` unedited.
#
# .github/RELEASE_NOTES.md is discardme-shaped staging, not a permanent
# artifact: produced by the authoring session, consumed here, and
# superseded (not explicitly deleted) the next time prepare-release.py
# runs for the following version. See CLAUDE.md's Release section.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the tag matches manifest.json's version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")"
          expected="v${version}"
          if [ "$tag" != "$expected" ]; then
            echo "::error::tag $tag does not match manifest.json version $version (expected $expected)"
            exit 1
          fi

      - name: Verify the staged release notes exist
        run: |
          set -euo pipefail
          if [ ! -s .github/RELEASE_NOTES.md ]; then
            echo "::error::.github/RELEASE_NOTES.md is missing or empty — run tools/prepare-release.py and commit it before tagging"
            exit 1
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file .github/RELEASE_NOTES.md
